# Cấu hình triển khai 1-click trên Render (https://render.com) — New > Blueprint > chọn repo này.
services:
  - type: web
    name: trip-website
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: SITE_URL
        value: https://tripdn.com
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_SCRIPT_URL
        sync: false
      - key: GOOGLE_SCRIPT_SECRET
        sync: false
    disk:
      name: trip-data
      mountPath: /var/data
      sizeGB: 1
    domains:
      - tripdn.com
      - www.tripdn.com
